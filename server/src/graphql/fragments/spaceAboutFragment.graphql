fragment spaceAboutFragment on SpaceAbout {
  id
  isContentPublic
  membership {
    myPrivileges
  }
  # Curated Classifications on the Space (feature 020). Read-only: the dashboards
  # count on `values`/`selectedValues` ids and display their labels. `display` is a
  # render-only flag and never gates counting.
  classifications {
    id
    displayLabel
    cardinality
    display
    sortOrder
    values {
      id
      label
    }
    selectedValues {
      id
      label
    }
  }
  profile {
    id
    displayName
    tagline
    location {
      country
      city
      geoLocation {
        latitude
        longitude
      }
    }
    url
    avatar: visual(type: AVATAR) {
      uri
    }
    banner: visual(type: BANNER) {
      uri
    }
    bannerWide: visual(type: BANNER_WIDE) {
      uri
    }
    tagsets {
      name
      tags
      type
      allowedValues
    }
  }
}
